<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexforge — AI-powered developer sandbox platform. Build, iterate, and deploy with autonomous AI assistance." />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph -->
    <meta property="og:title" content="Nexforge Studio" />
    <meta property="og:description" content="AI-powered developer sandbox platform" />
    <meta property="og:type" content="website" />

    <!-- Favicon (inline SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%2322d3ee'/></linearGradient></defs><polygon points='20,2 35,10.5 35,29.5 20,38 5,29.5 5,10.5' fill='url(%23g)' opacity='0.9'/><rect x='18.5' y='10' width='3' height='20' rx='1.5' fill='white'/><rect x='10' y='18.5' width='20' height='3' rx='1.5' fill='white'/><rect x='17' y='17' width='6' height='6' rx='1' transform='rotate(45 20 20)' fill='%2322d3ee'/></svg>" />

    <title>Nexforge Studio</title>

    <style>
      /* Critical above-fold styles to prevent FOUC */
      html, body {
        margin: 0;
        padding: 0;
        background: #09090b;
        color: #fafafa;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      /* Loading spinner */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #09090b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-nexforge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .loading-logo {
        animation: rotate-pulse 2s ease-in-out infinite;
      }
      @keyframes rotate-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
      .loading-bar {
        width: 120px;
        height: 2px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #22d3ee);
        border-radius: 2px;
        animation: loading-progress 1.5s ease-in-out infinite;
      }
      @keyframes loading-progress {
        0% { width: 0%; margin-left: 0%; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-nexforge">
        <svg class="loading-logo" width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="50%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <polygon points="20,2 35,10.5 35,29.5 20,38 5,29.5 5,10.5" fill="none" stroke="url(#lg)" stroke-width="1.5" opacity="0.6"/>
          <polygon points="20,6 32,13 32,27 20,34 8,27 8,13" fill="url(#lg)" opacity="0.12"/>
          <rect x="18.5" y="10" width="3" height="20" rx="1.5" fill="url(#lg)"/>
          <rect x="10" y="18.5" width="20" height="3" rx="1.5" fill="url(#lg)"/>
          <rect x="17" y="17" width="6" height="6" rx="1" transform="rotate(45 20 20)" fill="#22d3ee" opacity="0.9"/>
          <circle cx="20" cy="13" r="1.5" fill="#22d3ee" opacity="0.9"/>
          <circle cx="27" cy="20" r="1.5" fill="#6366f1" opacity="0.9"/>
          <circle cx="20" cy="27" r="1.5" fill="#22d3ee" opacity="0.9"/>
          <circle cx="13" cy="20" r="1.5" fill="#a855f7" opacity="0.9"/>
        </svg>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loading screen once React mounts
      window.addEventListener('load', () => {
        setTimeout(() => {
          const ls = document.getElementById('loading-screen');
          if (ls) ls.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
