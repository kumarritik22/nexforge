apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - image:  ai-orchestration
        imagePullPolicy: IfNotPresent
        name:  ai-server
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /api/ai/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ai/readyz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
          - name: GEMINI_API_KEY
            valueFrom: 
              secretKeyRef:
                name: ai-secret
                key: GEMINI_API_KEY
          
          - name: MONGO_URI
            valueFrom: 
              secretKeyRef:
                name: database
                key: AI

        ports:
        - containerPort:  3000
          name:  ai-server-port