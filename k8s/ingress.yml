apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexforge-ingress
  labels:
    app.kubernetes.io/name: nexforge-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
        - pathType: Prefix
          path: "/api/sandbox"
          backend:
            service:
              name: sandbox-service
              port: 
                number: 80
